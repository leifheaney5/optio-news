name: Deploy Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t optio-smoke .
      - name: Start container
        run: |
          docker run -d --name optio-smoke \
            -p 5000:5000 \
            -e PORT=5000 \
            -e DATABASE_URL=sqlite:////tmp/optio.db \
            -e SECRET_KEY=smoke-test-only \
            optio-smoke
      - name: Wait for login page
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs optio-smoke
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker logs optio-smoke || true
