name: Temporary Infrastructure Health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newleaf-live:
    runs-on: ubuntu-latest
    steps:
      - name: Probe New Leaf liveness and readiness
        run: |
          set -euo pipefail
          for path in /api/health /api/ready; do
            url="https://web-production-31a38.up.railway.app${path}"
            code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 "$url" || true)
            echo "$url -> HTTP $code"
            test "$code" = '200'
          done

  trodden-web:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://web-production-58073b.up.railway.app/' || true)" = '200'

  trodden-api:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://api-production-421a.up.railway.app/healthz' || true)" = '200'

  trodden-tiles:
    runs-on: ubuntu-latest
    steps:
      - run: test "$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 30 'https://tileserver-production-bfec.up.railway.app/catalog' || true)" = '200'
