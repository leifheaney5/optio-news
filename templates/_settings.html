<div class="settings-wrap">
    <button class="manage-feeds-btn" id="settingsBtn" title="Settings" aria-label="Settings"
            aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-cog" aria-hidden="true"></i>
    </button>
    <div class="settings-menu" id="settingsMenu" hidden>
        <div class="settings-user">
            <i class="fas fa-user-circle" aria-hidden="true"></i>
            <span title="{{ user.email }}">{{ user.email }}</span>
        </div>
        <label class="settings-item">
            <input type="checkbox" id="settingsTicker" checked>
            <span>Show headline ticker</span>
        </label>
        <button class="settings-item" id="settingsExport" type="button">
            <i class="fas fa-file-alt" aria-hidden="true"></i>
            Export bookmarks (.md)
        </button>
        <hr class="settings-divider">
        <button class="settings-item settings-danger" id="settingsDeleteAccount" type="button">
            <i class="fas fa-user-times" aria-hidden="true"></i>
            Delete account
        </button>
        <a class="settings-item" href="/logout">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            Sign out
        </a>
    </div>
</div>
